version: '3.8'

services:
  # Python FastAPI DeBERTa NLP Inference Microservice
  nlp-service:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: tourabsa-nlp-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Full-Stack Web Application (Node.js Express + Built React Frontend)
  web-app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: tourabsa-web-app
    restart: unless-stopped
    depends_on:
      nlp-service:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - NLP_SERVICE_URL=http://nlp-service:8000
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  server_data:
